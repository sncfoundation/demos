name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Python compile check
        run: python -m py_compile sep3/build_face.py
      - name: Apps Script syntax
        run: node --check < sep3/janitor.gs
      - name: Demo data is valid JSON
        run: jq empty sep3/*.json
